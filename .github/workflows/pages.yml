name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel a deploy that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html style.css src _site/
      # Pages lets browsers cache files for 10 minutes. Without this, a fresh
      # index.html can run with stale CSS/JS from the previous deploy. Every
      # reference gets the commit id, so a page always loads a matching set.
      - name: Version asset URLs
        run: |
          V=${GITHUB_SHA::8}
          sed -i "s#href=\"style.css\"#href=\"style.css?v=$V\"#; s#src=\"src/main.js\"#src=\"src/main.js?v=$V\"#" _site/index.html
          sed -i -E "s#(from '\./[a-z]+\.js)'#\1?v=$V'#g" _site/src/*.js
          grep -q "main.js?v=$V" _site/index.html
          ! grep -nE "from '\./[a-z]+\.js'" _site/src/*.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
